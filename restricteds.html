<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}CCTV System{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a0f;
    --panel: #0a1520;
    --panel2: #0d1c2e;
    --border: #1a3a5c;
    --accent: #1a6fd4;
    --accent2: #ff4444;
    --green: #22ff88;
    --yellow: #ffcc00;
    --text: #c8d8e8;
    --dim: #4a6a8a;
    --glow: 0 0 20px rgba(26,111,212,0.35);
    --sidebar: 240px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); font-family:'Rajdhani',sans-serif; color:var(--text); min-height:100vh; display:flex; }
  .grid-bg {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: linear-gradient(rgba(0,229,255,0.025) 1px,transparent 1px),
                      linear-gradient(90deg,rgba(0,229,255,0.025) 1px,transparent 1px);
    background-size:40px 40px;
  }

  /* SIDEBAR */
  .sidebar {
    position:fixed; left:0; top:0; bottom:0; width:var(--sidebar);
    background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; z-index:100;
  }
  .sidebar-logo {
    padding:22px 20px 18px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .sidebar-logo .icon { font-size:1.6rem; }
  .sidebar-logo .title {
    font-family:'Share Tech Mono',monospace;
    font-size:0.85rem; letter-spacing:3px; color:var(--accent);
    text-shadow:var(--glow); line-height:1.3;
  }
  .sidebar-logo .sub { font-size:0.65rem; color:var(--dim); letter-spacing:2px; }

  nav { flex:1; padding:16px 0; overflow-y:auto; }
  nav a {
    display:flex; align-items:center; gap:12px;
    padding:12px 20px; color:var(--dim);
    text-decoration:none; font-size:0.85rem; letter-spacing:2px;
    font-family:'Share Tech Mono',monospace;
    transition:all 0.2s; border-left:3px solid transparent;
  }
  nav a:hover, nav a.active {
    color:var(--accent); background:rgba(0,229,255,0.06);
    border-left-color:var(--accent);
  }
  nav a .nav-icon { font-size:1.1rem; width:22px; text-align:center; }

  .sidebar-bottom {
    padding:16px 20px; border-top:1px solid var(--border);
    font-family:'Share Tech Mono',monospace; font-size:0.7rem;
  }
  .user-badge { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .user-dot { width:8px; height:8px; border-radius:50%; background:var(--green); animation:blink 2s infinite; }
  .user-name { color:var(--text); font-size:0.8rem; }
  .btn-logout {
    display:block; text-align:center; padding:8px;
    border:1px solid rgba(255,68,68,0.4); color:var(--accent2);
    text-decoration:none; font-family:'Share Tech Mono',monospace;
    font-size:0.72rem; letter-spacing:2px; transition:all 0.2s;
  }
  .btn-logout:hover { background:rgba(255,68,68,0.1); }

  /* MAIN */
  .main { margin-left:var(--sidebar); flex:1; display:flex; flex-direction:column; position:relative; z-index:1; }
  .topbar {
    background:var(--panel); border-bottom:1px solid var(--border);
    padding:14px 28px; display:flex; align-items:center; justify-content:space-between;
    font-family:'Share Tech Mono',monospace;
  }
  .topbar .page-title { color:var(--accent); letter-spacing:4px; font-size:0.9rem; }
  .topbar .meta { display:flex; gap:20px; color:var(--dim); font-size:0.72rem; align-items:center; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--accent2); animation:blink 1s infinite; display:inline-block; margin-right:5px; }

  .content { padding:28px; flex:1; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
<meta name="csrf-token" content="{{session['csrf_token']}}">
{% block extra_head %}{% endblock %}

</head>
<body>
<div class="grid-bg"></div>
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="icon">📷</div>
    <div>
      <div class="title">SENTINELS</div>
      <div class="sub">SURVEILLANCE SYS</div>
    </div>
  </div>
  <nav>
    <a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">
      <span class="nav-icon">🖥</span> DASHBOARD
    </a>
    <a href="/footage" class="{% if request.path == '/footage' %}active{% endif %}">
      <span class="nav-icon">🎞</span> FOOTAGE
    </a>
    <a href="/logs" class="{% if request.path == '/logs' %}active{% endif %}">
      <span class="nav-icon">📋</span> LOGS
    </a>
    <a href="/admin" class="{% if request.path == '/admin' %}active{% endif %}">
      <span class="nav-icon">🎞</span> ADMIN
    </a>
  </nav>
  <div class="sidebar-bottom">
    <div class="user-badge">
      <div class="user-dot"></div>
      <div class="user-name">{{ user|upper }}</div>
    </div>
    <a href="/logout" class="btn-logout">SIGN OUT</a>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <span class="page-title">{% block page_title %}OVERVIEW{% endblock %}</span>
    <div class="meta">
      <span><span class="live-dot"></span>LIVE</span>
      <span id="clock">--:--:--</span>
      <span id="date-str">----</span>
    </div>
  </div>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
</div>

<script>
  function tick(){
    const now=new Date();
    document.getElementById('clock').textContent=now.toLocaleTimeString('en-GB',{hour12:false});
    document.getElementById('date-str').textContent=now.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
  }
  tick(); setInterval(tick,1000);
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
